name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Piramide de pruebas (calidad/piramide_de_pruebas.md): base -> medio -> punta
      - name: Pruebas unitarias (dominio, casos de uso y adaptadores con dobles)
        run: npm run test:unitarias
      - name: Pruebas de integracion (API HTTP + SQLite) con cobertura minima de 80 %
        run: npm run coverage
      - name: Pruebas de punta a punta de la API (servidor real como proceso)
        run: npm run test:e2e
      - name: Reglas de dependencia de la arquitectura hexagonal
        run: npm run arch:check

  # La misma suite de la API contra un SurrealDB real (la fuente de verdad en ejecucion)
  backend-surreal:
    runs-on: ubuntu-latest
    env:
      SURREAL_VERSION: v3.0.4
      # CI prueba contra un SurrealDB local efimero; el default de la app es el remoto,
      # asi que aca se apunta explicitamente a la instancia de CI.
      SURREAL_URL: http://127.0.0.1:8000
      SURREAL_USER: root
      SURREAL_PASS: root
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Levantar SurrealDB
        run: |
          curl -sSfL -o /tmp/surreal.tgz "https://github.com/surrealdb/surrealdb/releases/download/${SURREAL_VERSION}/surreal-${SURREAL_VERSION}.linux-amd64.tgz"
          tar xzf /tmp/surreal.tgz -C /tmp
          /tmp/surreal start --user root --pass root --bind 127.0.0.1:8000 memory > /tmp/surreal.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -s http://127.0.0.1:8000/version
      - run: npm run test:surreal
      - run: node scripts/verificar-surreal.js
        env:
          SURREAL_NS: verificacion

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run typecheck

  # Punta de la piramide: la app web real en un navegador (Playwright, vista de celular)
  e2e-web:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npm ci --legacy-peer-deps && npx expo export --platform web
        working-directory: frontend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - name: Guardar el reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: e2e/reporte
